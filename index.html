<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#06080f;--surface:#0d1117;--card:#131921;--card2:#1a2230;--border:#1c2333;--border2:#2a3548;--text:#e6edf3;--dim:#8b949e;--muted:#545d68;--cyan:#00d4ff;--green:#2dd4a8;--red:#ff6b6b;--orange:#ffaa33;--yellow:#ffe066;--pink:#ff79c6;--mobile:#ff6b35;--console:#7c5cfc;--accent:#00b894}
body{font-family:'Outfit','Noto Sans TC',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:60px 60px;opacity:.1;pointer-events:none;z-index:0}
.app{position:relative;z-index:1}
a{color:var(--cyan);text-decoration:none}
.hdr{padding:12px 24px;border-bottom:1px solid var(--border);background:rgba(13,17,23,.96);backdrop-filter:blur(16px);position:sticky;top:0;z-index:100}
.hdr-in{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo-ic{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--cyan),var(--console));display:flex;align-items:center;justify-content:center;font-size:17px}
.logo h1{font-size:15px;font-weight:800;letter-spacing:-.4px}
.logo small{display:block;font-size:10px;color:var(--muted);font-weight:400}
.main-tabs{display:flex;gap:4px}
.main-tab{padding:7px 16px;border-radius:8px;font-size:13px;font-weight:700;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font-family:inherit;transition:all .2s;display:flex;align-items:center;gap:6px}
.main-tab.on{background:var(--card2);color:var(--cyan);border-color:rgba(0,212,255,.3)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}

.r-controls{max-width:1440px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--border);background:rgba(13,17,23,.8);position:sticky;top:57px;z-index:99}
.r-select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit;outline:none}
.r-select:focus{border-color:var(--cyan)}

.r-analysis{background:rgba(255,249,230,.04);border:1px solid rgba(240,192,64,.2);border-radius:12px;padding:14px 16px;margin-bottom:20px}

.i-plat-tabs{display:flex;gap:0;margin-bottom:0}
.i-ptab{flex:1;padding:11px 16px;cursor:pointer;border:1px solid var(--border);border-bottom:none;border-radius:12px 12px 0 0;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;background:var(--surface);font-family:inherit;color:var(--muted)}

.i-stats{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.i-sbox{flex:1;min-width:110px;padding:10px 14px;background:var(--surface);border-radius:8px;border:1px solid var(--border)}

.gcard-h{display:flex;justify-content:space-between;align-items:start;margin-bottom:6px;gap:6px}

.gcard-f{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);padding-top:6px;border-top:1px solid var(--border)}
.pill{display:inline-block;padding:1px 8px;border-radius:16px;font-size:10px;font-weight:700}
.kanban{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.kcol{min-width:240px;flex:1}
.kcol-h{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:6px;margin-bottom:8px}
.bitem{padding:14px;border-radius:10px;margin-bottom:8px;border-left:4px solid}
.bitem.bu{background:rgba(255,107,107,.05);border-left-color:var(--red)}
.bitem.bw{background:rgba(255,170,51,.05);border-left-color:var(--orange)}
.bitem.bi{background:rgba(84,93,104,.06);border-left-color:var(--muted)}
.bitem-t{font-size:13px;font-weight:700;margin-bottom:4px}

.bitem-a{padding:6px 10px;border-radius:6px;font-size:11px;background:rgba(0,212,255,.05);border:1px solid rgba(0,212,255,.12);color:var(--cyan)}
.threat-card{background:var(--surface);border-radius:10px;padding:16px;border:1px solid var(--border);margin-bottom:10px;border-left:4px solid}
.tl-track{display:flex;align-items:center;padding:8px 0;overflow-x:auto}

.tl-dot{width:12px;height:12px;border-radius:6px;border:2px solid var(--bg);z-index:1}

.gantt-wrap{overflow-x:auto;padding-bottom:6px}

.gantt-lbl{width:150px;min-width:150px;font-size:10px;font-weight:700;color:var(--muted);padding:3px 6px}

.gantt-mh.qs{border-left:2px solid var(--border2)}
.gantt-row{display:flex;align-items:center;border-bottom:1px solid var(--border);min-height:30px}
.gantt-row:hover{background:var(--card2)}
.gantt-row-lbl{width:150px;min-width:150px;padding:4px 6px;display:flex;align-items:center;gap:4px}
.gantt-row-nm{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gantt-row-chart{flex:1;position:relative;height:24px;display:flex}
.gantt-cell{flex:1;border-left:1px solid var(--border)}
.gantt-cell.qs{border-left:2px solid var(--border2)}
.gantt-bar{position:absolute;height:16px;top:4px;border-radius:3px;min-width:3px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.gantt-bar:hover{opacity:.8;z-index:1}
.gantt-bar-t{font-size:8px;font-weight:700;color:#000;white-space:nowrap;overflow:hidden;padding:0 3px}
.gantt-today{position:absolute;top:0;bottom:0;width:2px;background:var(--cyan);z-index:1;opacity:.5}
.i-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300;display:flex;justify-content:center;align-items:flex-start;padding:28px 16px;overflow-y:auto;backdrop-filter:blur(4px);animation:fi .2s}

@media(max-width:768px){.hdr{padding:10px 12px}.r-controls{padding:8px 12px;top:52px}.r-content{padding:12px}.i-wrap{padding:12px}.r-grid{grid-template-columns:repeat(2,1fr)}.gantt-lbl,.gantt-row-lbl{width:100px;min-width:100px}}

<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel">
const {useState,useMemo,useEffect}=React;

const GAS_URL='https://script.google.com/macros/s/AKfycbxKBRt_hT6vvOjn2d9ZTZqGevmrRbLSJigBvnBST8qbO8nvRLnW9ftYRHPXlnrPYeGe6w/exec';
const INTEL_BASE='https://tony0424001-crypto.github.io/game-market-intel/data';

const SM={"announced":"已公佈","pre-reg":"預註冊","cbt":"封測中","soft-launch":"軟啟動","live-ops":"已上線","launch":"上線","media":"媒體曝光","launched":"已上線"};
const SC={"announced":"#545d68","pre-reg":"#ffaa33","cbt":"#00d4ff","soft-launch":"#7c5cfc","live-ops":"#2dd4a8","launch":"#2dd4a8","media":"#ff79c6","launched":"#2dd4a8"};
const TM={critical:"極高",high:"高",medium:"中",low:"低"};
const TC={critical:"#ff6b6b",high:"#ffaa33",medium:"#ffe066",low:"#2dd4a8"};
const ST=["announced","pre-reg","cbt","soft-launch","live-ops"];
const PM={urgent:{c:"bu",l:"🚨 需立即行動",k:"var(--red)"},watch:{c:"bw",l:"👁 值得關注",k:"var(--orange)"},info:{c:"bi",l:"ℹ️ 背景資訊",k:"var(--muted)"}};
const MZH=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
const FLAG={"CN":"🇨🇳","TW/HK/MO":"🇹🇼","JP":"🇯🇵","KR":"🇰🇷","Global":"🌏","TW":"🇹🇼"};

function useJson(url,fb){
  const[d,setD]=useState(null);const[l,setL]=useState(true);
  useEffect(()=>{let c=false;fetch(url).then(r=>{if(!r.ok)throw r.status;return r.json()}).then(j=>{if(!c){setD(j);setL(false)}}).catch(()=>{if(!c){setD(fb);setL(false)}});return()=>{c=true}},[url]);
  return[d,l];
}

function matchGameName(rankName,intelName){
  if(!rankName||!intelName)return false;
  const norm=s=>s.toLowerCase().replace(/[®™©：:·\-\s『』「」【】《》]/g,'').replace(/[^\u4e00-\u9fa5a-z0-9]/g,'').trim();
  const rn=norm(rankName),inn=norm(intelName);
  if(!rn||!inn)return false;
  if(rn===inn)return true;
  if(rn.length>=4&&inn.includes(rn))return true;
  if(inn.length>=4&&rn.includes(inn))return true;
  if(rn.length>=6&&inn.length>=6&&rn.substring(0,6)===inn.substring(0,6))return true;
  return false;
}
function findIntel(gameName,products){
  if(!products||!gameName)return null;
  return products.find(p=>matchGameName(gameName,p.name)||(p.nameEn&&matchGameName(gameName,p.nameEn)))||null;
}
function daysUntil(ds){if(!ds)return null;const m=ds.match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return null;const t=new Date(+m[1],+m[2]-1,+m[3]);const n=new Date();n.setHours(0,0,0,0);return Math.ceil((t-n)/86400000);}

// ── 強化版 parseD，支援多種格式 ──
function parseD(s){
  if(!s||typeof s!=='string')return null;
  s=s.trim();
  // YYYY-MM
  let m=s.match(/^(\d{4})-(\d{2})$/);
  if(m)return{y:+m[1],m:+m[2]};
  // YYYY-QN
  let q=s.match(/^(\d{4})-Q(\d)$/i);
  if(q)return{y:+q[1],m:{1:2,2:5,3:8,4:11}[q[2]]||6};
  // YYYY/MM
  let sm=s.match(/^(\d{4})\/(\d{1,2})$/);
  if(sm)return{y:+sm[1],m:+sm[2]};
  // YYYY年MM月
  let ym=s.match(/^(\d{4})年(\d{1,2})月/);
  if(ym)return{y:+ym[1],m:+ym[2]};
  // QN YYYY 或 YYYY QN
  let qy=s.match(/Q(\d)\s*(\d{4})/i)||s.match(/(\d{4})\s*Q(\d)/i);
  if(qy){const qi=qy[0].match(/Q(\d)/i);const yi=qy[0].match(/(\d{4})/);if(qi&&yi)return{y:+yi[1],m:{1:2,2:5,3:8,4:11}[qi[1]]||6};}
  // YYYY only
  let yo=s.match(/^(\d{4})$/);
  if(yo)return{y:+yo[1],m:6};
  // 上半年/下半年
  if(s.match(/(\d{4}).*上半年/)){const y=s.match(/(\d{4})/);if(y)return{y:+y[1],m:3};}
  if(s.match(/(\d{4}).*下半年/)){const y=s.match(/(\d{4})/);if(y)return{y:+y[1],m:9};}
  return null;
}

function GanttView({games,onSelect}){
  const now=new Date();const ny=now.getFullYear();const nm=now.getMonth()+1;
  const months=[];
  for(let y=ny-1;y<=ny+2;y++){for(let m=1;m<=12;m++)months.push({y,m,lb:MZH[m-1],qs:m===1||m===4||m===7||m===10});}
  const mi=(y,m)=>months.findIndex(t=>t.y===y&&t.m===m);
  const ni=mi(ny,nm);
  const sorted=[...games].sort((a,b)=>{const da=parseD(a.launchEst);const db=parseD(b.launchEst);if(!da&&!db)return 0;if(!da)return 1;if(!db)return-1;return(da.y*12+da.m)-(db.y*12+db.m);});
  function barInfo(g){let si=null;if(g.history&&g.history.length>0){const d=parseD(g.history[0].date);if(d)si=mi(d.y,d.m);}let ei=null;const ld=parseD(g.launchEst);if(ld)ei=mi(ld.y,ld.m);if(si===null&&ei!==null)si=Math.max(0,ei-3);if(si===null)si=0;if(ei===null)ei=months.length-1;si=Math.max(0,Math.min(si,months.length-1));ei=Math.max(0,Math.min(ei,months.length-1));return{si,ei};}
  return(<div>
    <div className="gantt-wrap"><div className="gantt">
      <div className="gantt-hdr"><div className="gantt-lbl">產品</div><div className="gantt-cols">
        {months.map((t,i)=><div key={i} className={`gantt-mh${t.y===ny&&t.m===nm?" now":""}${t.qs?" qs":""}`}>{t.lb}</div>)}
      </div></div>
      {sorted.map(g=>{const{si,ei}=barInfo(g);const l=`${(si/months.length)*100}%`;const w=`${(Math.max(1,ei-si+1)/months.length)*100}%`;
      const tt=g.testType||"";const barClr=tt.includes("不刪檔")?"var(--red)":tt.includes("刪檔計費")?"var(--orange)":tt.includes("刪檔不計費")?"var(--green)":tt.includes("限量")?"var(--cyan)":"var(--muted)";
      return(<div key={g.id} className="gantt-row">
        <div className="gantt-row-lbl"><div style={{width:3,height:16,borderRadius:1,background:safeThreatClr(g.threat),flexShrink:0}}/><div className="gantt-row-nm" title={g.name}>{g.name}</div></div>

          {ni>=0&&<div className="gantt-today" style={{left:`${(ni/months.length)*100}%`}}/>}
          <div className="gantt-bar" style={{left:l,width:w,background:barClr,border:`1px solid ${safeThreatClr(g.threat)}`}} onClick={()=>onSelect(g)} title={`${g.name} — ${g.launchEst}`}><span className="gantt-bar-t">{g.launchEst}</span></div>

        <div style={{fontSize:11,fontWeight:700,color:"var(--muted)",textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>品類飽和度（開發中÷已上線）</div>
        {saturation.map(d=>{const sn=parseFloat(d.sat);const clr=isNaN(sn)?"var(--cyan)":sn>=3?"var(--red)":sn>=2?"var(--orange)":"var(--green)";
        return<div key={d.genre} style={{display:"flex",alignItems:"center",gap:8,marginBottom:5,padding:"4px 8px",borderRadius:6,background:"var(--card)"}}>

// ── 修正版 LaunchView ──
function LaunchView({games}){
  const now=new Date();
  const curYear=now.getFullYear();
  const curM=now.getMonth(); // 0-indexed
  const BAR_MAX_H=100;

  // 預計算每個月的產品列表
  const monthData=useMemo(()=>{
    return MZH.map((_,mi)=>{
      const items=games.filter(g=>{
        const d=parseD(g.launchEst);
        if(!d)return false;
        return d.y>=(curYear-1)&&d.y<=(curYear+1)&&d.m===(mi+1);
      });
      return{total:items.length,names:items.map(g=>g.name),items};
    });
  },[games,curYear]);

  const max=useMemo(()=>Math.max(...monthData.map(m=>m.total),1),[monthData]);

  // 統計可解析的產品數量（用於除錯顯示）
  const parseable=games.filter(g=>parseD(g.launchEst)!==null).length;

  return(<div>
    <div style={{fontSize:12,color:"var(--dim)",marginBottom:14,padding:"8px 12px",borderRadius:8,background:"var(--surface)",border:"1px solid var(--border)"}}>
      🚀 <strong>上線時機分析</strong> — 各月競品密度（{curYear-1}～{curYear+1}年）
      <span style={{marginLeft:8,color:"var(--muted)"}}>共 {games.length} 款 · {parseable} 款有日期資料</span>
    </div>

    {/* 長條圖 */}
    <div style={{background:"var(--surface)",borderRadius:10,padding:"16px 16px 8px",border:"1px solid var(--border)",marginBottom:16}}>
      <div style={{display:"flex",alignItems:"flex-end",gap:2,height:BAR_MAX_H+"px",marginBottom:4}}>
        {monthData.map((md,i)=>{
          const h=md.total>0?Math.max(Math.round((md.total/max)*BAR_MAX_H),4):0;
          const clr=md.total>4?"var(--red)":md.total>2?"var(--orange)":md.total>0?"var(--cyan)":"var(--border)";
          return<div key={i} style={{flex:1,height:h+"px",background:clr,borderRadius:"3px 3px 0 0",minWidth:16,cursor:md.total>0?"pointer":"default",outline:i===curM?"2px solid var(--cyan)":"none",outlineOffset:"-1px",transition:"height .3s"}} title={md.names.join("、")}/>;
        })}
      </div>
      <div style={{display:"flex",gap:2,borderTop:"1px solid var(--border2)",paddingTop:4}}>
        {monthData.map((md,i)=>(
          <div key={i} style={{flex:1,textAlign:"center"}}>
            <div style={{fontSize:9,color:i===curM?"var(--cyan)":"var(--muted)",fontWeight:i===curM?700:400}}>{MZH[i]}</div>
            <div style={{fontSize:10,fontWeight:700,color:md.total>0?"var(--text)":"transparent",minHeight:14}}>{md.total||""}</div>
          </div>
        ))}
      </div>
    </div>

    {/* 月份明細 */}
    <div style={{fontSize:11,fontWeight:700,color:"var(--muted)",textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>
      各月上線產品明細
    </div>
    {parseable===0&&<div className="empty"><div className="ic">📅</div><div>產品資料中沒有可解析的日期格式<br/><span style={{fontSize:11,color:"var(--muted)"}}>支援格式：2026-06、2026-Q2、2026/06、2026年6月、2026</span></div></div>}
    {parseable>0&&<div style={{display:"flex",gap:0,overflowX:"auto",border:"1px solid var(--border)",borderRadius:8,overflow:"hidden"}}>
      {monthData.map((md,i)=>(
        <div key={i} style={{flex:1,minWidth:80,borderRight:i<11?"1px solid var(--border)":"none"}}>
          <div style={{
            textAlign:"center",padding:"6px 4px",fontSize:11,fontWeight:800,
            color:md.total>3?"var(--red)":md.total>0?"var(--text)":"var(--muted)",
            background:i===curM?"rgba(0,212,255,.08)":md.total>0?"var(--card2)":"transparent",
            borderBottom:"1px solid var(--border)"
          }}>{MZH[i]}{md.total>0&&<span style={{fontSize:9,color:"var(--muted)",marginLeft:3}}>({md.total})</span>}</div>
          <div style={{padding:"4px"}}>
            {md.items.map((g,gi)=>{
              const clr=safeThreatClr(g.threat);
              return<div key={g.id||gi} style={{
                padding:"3px 5px",marginBottom:2,borderRadius:4,
                background:clr+"18",borderLeft:"2px solid "+clr,
                fontSize:9,lineHeight:1.4,cursor:"pointer"
              }} title={g.launchEst||""}>
                <div style={{fontWeight:700,color:"var(--text)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{g.name}</div>
                {g.launchEst&&<div style={{fontSize:8,color:"var(--muted)"}}>{g.launchEst}</div>}
              </div>;
            })}
            {md.total===0&&<div style={{fontSize:9,color:"var(--muted)",textAlign:"center",padding:"8px 2px"}}>—</div>}
          </div>
        </div>
      ))}
    </div>}
  </div>);
}

function QProductsView({games,onSelect,ac}){
  const qc={"Q1":"#00d4ff","Q2":"#2dd4a8","Q3":"#ffaa33","Q4":"#ff6b6b"};
  const ql={"Q1":"第一季 (1-3月)","Q2":"第二季 (4-6月)","Q3":"第三季 (7-9月)","Q4":"第四季 (10-12月)"};
  const grouped={"Q1":[],"Q2":[],"Q3":[],"Q4":[],"未定":[]};
  games.forEach(g=>{const q=getQ(g.launchEst);if(q&&grouped[q])grouped[q].push(g);else grouped["未定"].push(g);});
  return(<div>{["Q1","Q2","Q3","Q4","未定"].map(q=>{const items=grouped[q];if(!items.length)return null;const clr=qc[q]||"var(--muted)";
    return(<div key={q} style={{marginBottom:24}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,padding:"8px 14px",borderRadius:8,background:`${clr}0a`,border:`1px solid ${clr}22`}}>
        <div style={{minWidth:36,height:24,borderRadius:12,background:clr,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:800,color:"#000"}}>{q}</div>
        <span style={{fontSize:14,fontWeight:700}}>{ql[q]||"上線時間未定"}</span>
        <span style={{fontSize:11,color:"var(--muted)",marginLeft:"auto"}}>{items.length} 款</span>
      </div>
      <div className="i-grid">{items.map(g=><IntelGameCard key={g.id} g={g} onClick={onSelect} ac={ac}/>)}</div>

function IntelTab(){
  const[plat,setPlat]=useState("mobile");
  const[mod,setMod]=useState("list");
  const[search,setSearch]=useState("");
  const[sf,setSf]=useState("all");
  const[tf,setTf]=useState("all");
  const[sel,setSel]=useState(null);
  const[products,pLd]=useJson(`${INTEL_BASE}/products.json`,[]);
  const[brief]=useJson(`${INTEL_BASE}/daily-brief.json`,{items:[]});
  const[qdata]=useJson(`${INTEL_BASE}/quarterly.json`,{year:2026,quarters:{}});
  const all=products||[];
  const mob=useMemo(()=>all.filter(g=>g.platform&&g.platform.includes("Mobile")),[all]);
  const con=useMemo(()=>all.filter(g=>!g.platform||!g.platform.includes("Mobile")),[all]);
  const base=plat==="mobile"?mob:con;
  const ac=plat==="mobile"?"var(--mobile)":"var(--console)";
  const filtered=useMemo(()=>{
    let r=base;
    if(search.trim()){const q=search.toLowerCase();r=r.filter(g=>g.name.toLowerCase().includes(q)||(g.nameEn||"").toLowerCase().includes(q)||(g.studio||"").toLowerCase().includes(q)||(g.genre||"").toLowerCase().includes(q)||(g.tags||[]).some(t=>t.toLowerCase().includes(q)));}
    if(sf!=="all")r=r.filter(g=>g.stage===sf);
    if(tf!=="all")r=r.filter(g=>g.threat===tf);
    return r;
  },[base,search,sf,tf]);
  const MODS=[
    {id:"list",l:"產品總覽",i:"📋"},{id:"kanban",l:"階段看板",i:"🛰"},{id:"threat",l:"威脅分析",i:"⚠️"},{id:"tracking",l:"追蹤",i:"📡"},
    {id:"gantt",l:"甘特圖",i:"📊"},{id:"qprod",l:"季度產品",i:"📦"},
    {id:"trend",l:"趨勢",i:"📈"},{id:"launch",l:"上線時機",i:"🚀"},
    {id:"brief",l:"每日簡報",i:"☀️"},{id:"quarterly",l:"季度事件",i:"📅"},{id:"industry",l:"產業動態",i:"🏢"},
  ];
  const showFilters=["list","kanban"].includes(mod);
  if(pLd)return<div className="loading"><div className="spinner"/><div>載入情報資料...</div></div>;
  return(<div className="i-wrap">
    <div className="i-plat-tabs">
      <button className={`i-ptab ${plat==="mobile"?"am":""}`} onClick={()=>{setPlat("mobile");setSf("all");setTf("all");setSearch("");}}>📱 手機遊戲<span className="badge">{mob.length}</span></button>
      <button className={`i-ptab ${plat==="console"?"ac":""}`} onClick={()=>{setPlat("console");setSf("all");setTf("all");setSearch("");}}>🎮 主機/PC<span className="badge">{con.length}</span></button>
    </div>
    <div className="i-content">
      <div className="i-views">{MODS.map(m=><button key={m.id} className={`i-view ${mod===m.id?"on":""}`} onClick={()=>setMod(m.id)}>{m.i} {m.l}</button>)}</div>
      {showFilters&&<>
        <div className="i-stats">
          <div className="i-sbox"><div className="lb">產品數</div><div className="vl" style={{color:ac}}>{base.length}</div></div>
          <div className="i-sbox"><div className="lb">高威脅+</div><div className="vl" style={{color:"var(--red)"}}>{base.filter(g=>g.threat==="critical"||g.threat==="high").length}</div></div>
          <div className="i-sbox"><div className="lb">封測中</div><div className="vl" style={{color:"var(--cyan)"}}>{base.filter(g=>g.stage==="cbt").length}</div></div>
          <div className="i-sbox"><div className="lb">即將上線</div><div className="vl" style={{color:"var(--console)"}}>{base.filter(g=>["soft-launch","pre-reg"].includes(g.stage)).length}</div></div>
        </div>
        <div className="i-search">
          <input className="i-sinput" placeholder="🔍 搜尋遊戲名稱、開發商、品類..." value={search} onChange={e=>setSearch(e.target.value)}/>
          <button className={`i-fbtn ${sf==="all"?"on":""}`} onClick={()=>setSf("all")}>全部</button>
          {ST.map(s=>{const n=base.filter(g=>g.stage===s).length;return n?<button key={s} className={`i-fbtn ${sf===s?"on":""}`} onClick={()=>setSf(sf===s?"all":s)}>{SM[s]}({n})</button>:null})}
          {["critical","high"].map(t=>{const n=base.filter(g=>g.threat===t).length;return n?<button key={t} className="i-fbtn" style={tf===t?{background:TC[t],color:"#000",borderColor:TC[t]}:{}} onClick={()=>setTf(tf===t?"all":t)}>威脅{TM[t]}({n})</button>:null})}
        </div>
      </>}
      {mod==="list"&&(()=>{
        const tOrder={critical:0,high:1,medium:2,low:3};
        const sorted=[...filtered].sort((a,b)=>tOrder[a.threat]-tOrder[b.threat]||(b.prereg||0)-(a.prereg||0));
        const groups=[{key:"critical",label:"🚨 威脅極高",clr:"var(--red)"},{key:"high",label:"⚠️ 威脅高",clr:"var(--orange)"},{key:"medium",label:"● 威脅中",clr:"var(--yellow)"},{key:"low",label:"○ 威脅低",clr:"var(--green)"}];
        return sorted.length?<div>{groups.map(gr=>{const items=sorted.filter(g=>g.threat===gr.key);if(!items.length)return null;
          return<div key={gr.key} style={{marginBottom:20}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,padding:"6px 12px",borderRadius:8,background:`${gr.clr}0a`,borderLeft:`3px solid ${gr.clr}`}}>
              <span style={{fontSize:13,fontWeight:700,color:gr.clr}}>{gr.label}</span>
              <span style={{fontSize:11,color:"var(--muted)"}}>{items.length} 款</span>
            </div>
            <div className="i-grid">{items.map(g=><IntelGameCard key={g.id} g={g} onClick={setSel} ac={ac}/>)}</div>
          </div>})}</div>:<div className="empty"><div className="ic">🔍</div><div>無符合條件的產品</div></div>;
      })()}
      {mod==="kanban"&&<div className="kanban">{ST.map(s=>{const gs=[...filtered.filter(g=>g.stage===s)].sort((a,b)=>{const o={critical:0,high:1,medium:2,low:3};return o[a.threat]-o[b.threat]||(b.prereg||0)-(a.prereg||0)});
        return<div key={s} className="kcol">
          <div className="kcol-h" style={{background:`${SC[s]||"#545d68"}12`,borderLeft:`3px solid ${SC[s]||"#545d68"}`}}><span style={{width:7,height:7,borderRadius:4,background:SC[s]||"#545d68"}}/><span style={{fontSize:11,fontWeight:700,color:SC[s]||"#545d68"}}>{SM[s]||s}</span><span style={{fontSize:10,color:"var(--muted)",marginLeft:"auto"}}>{gs.length}</span></div>
          {gs.map(g=><IntelGameCard key={g.id} g={g} onClick={setSel} ac={ac}/>)}
          {!gs.length&&<div style={{textAlign:"center",padding:16,fontSize:11,color:"var(--muted)"}}>無產品</div>}
        </div>})}</div>}
      {mod==="threat"&&<ThreatView games={base.filter(g=>g.category!=="tracking")} onSelect={setSel}/>}
      {mod==="tracking"&&<TrackingView games={base}/>}
      {mod==="gantt"&&<GanttView games={base.filter(g=>g.category!=="tracking")} onSelect={setSel}/>}
      {mod==="qprod"&&<QProductsView games={base.filter(g=>g.category!=="tracking")} onSelect={setSel} ac={ac}/>}
      {mod==="trend"&&<TrendView games={base}/>}
      {mod==="launch"&&<LaunchView games={base.filter(g=>g.category!=="tracking")}/>}
      {mod==="brief"&&<BriefView plat={plat} data={brief}/>}
      {mod==="quarterly"&&<QuarterlyView plat={plat} data={qdata}/>}
      {mod==="industry"&&<IndustryView/>}
    </div>
    {sel&&<IntelModal game={sel} onClose={()=>setSel(null)}/>}
  </div>);}

function RankingTab({intelProducts}){
  const[daysData,setDaysData]=useState([]);

    fetch(GAS_URL+'?action=data')

      .then(result=>{setDaysData(result.days||[]);setLoading(false);})
      .catch(()=>setLoading(false));
  },[]);

    setAppModal({loading:true});

      .then(r=>r.json()).then(d=>{if(d.results&&d.results.length)setAppModal({type:"ios",data:d.results[0]});else setAppModal({error:`找不到「${q}」`});})

    setAppModal({loading:true});

      .then(r=>r.json()).then(d=>{if(d&&d.name)setAppModal({type:"gp",data:d});else setAppModal({error:`找不到「${q}」`});})
      .catch(()=>setAppModal({error:"搜尋失敗"}));
  }

      setAppModal({loading:true});

    {key:"iosGross",label:"App Store 收入",cls:"ios",plat:"ios"},
    {key:"gpFree",label:"Google Play 免費",cls:"gp",plat:"gp"},
    {key:"gpGross",label:"Google Play 收入",cls:"gp",plat:"gp"},
  ];

  if(loading)return<div className="loading"><div className="spinner"/><div>載入排行資料...</div></div>;

  return(<>
    <div className="r-controls">
      <label style={{fontSize:12,color:"var(--muted)"}}>🌏</label>
      <select className="r-select" value={region} onChange={e=>setRegion(e.target.value)}>
        <optgroup label="── 主要地區 ──">
          {["[TW] 台灣","[HK] 香港","[MO] 澳門","[JP] 日本","[KR] 韓國"].map(r=><option key={r} value={r}>{r}</option>)}
        </optgroup>
        <optgroup label="── 下午2點更新 ──">
          {["[US] 美國","[SG] 新加坡","[MY] 馬來西亞"].map(r=><option key={r} value={r}>{r}</option>)}
        </optgroup>
      </select>
      <label style={{fontSize:12,color:"var(--muted)"}}>📅</label>
      <select className="r-select" value={dayIdx} onChange={e=>setDayIdx(+e.target.value)}>
        {daysData.map((d,i)=>d&&<option key={i} value={i}>{i===0?"今日":i===1?"昨日":"前天"}（{d.today}）</option>)}
      </select>
      <select className="r-select" value={searchPlat} onChange={e=>setSearchPlat(e.target.value)}>
        <option value="ios">📱 iOS</option>
        <option value="gp">🤖 Android</option>
      </select>
      <input style={{padding:"7px 12px",borderRadius:8,border:"1px solid var(--border)",background:"var(--card)",color:"var(--text)",fontSize:12,fontFamily:"inherit",outline:"none",width:160}} placeholder="搜尋 App..." value={searchInput} onChange={e=>setSearchInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doSearch()}/>
      <button onClick={doSearch} style={{padding:"7px 14px",borderRadius:8,background:"var(--cyan)",color:"#003d2b",border:"none",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>搜尋</button>
      <div className="r-date-tag">📅 {day.today||"載入中"}</div>
    </div>
    <div className="r-content">
      {analysis&&analysis.length>0&&<div className="r-analysis">
        <div className="r-analysis-title">📊 排名變動分析（今日 vs 昨日）</div>
        {analysis.map((chart,ci)=>(<div key={ci}>
          <div className="r-analysis-chart-label">{chart.chartLabel}</div>
          {chart.findings.slice(0,25).map((f,fi)=>(
            <div key={fi} className="r-analysis-item">
              {f.type==="new"?<span className="r-badge-new">新進前10</span>:<span className="r-badge-rise">↑{f.rise}名</span>}
              <div className="r-analysis-body">
                <div>
                  <span className="r-analysis-name" onClick={()=>{const intel=findIntel(f.name,intelProducts);if(intel)setIntelModal(intel);}}>{f.name}</span>
                  <span className="r-analysis-rank">{f.oldRank?`(#${f.oldRank} → #${f.newRank})`:`(新上榜 → #${f.newRank})`}</span>
                </div>
                {f.aiReason&&<div className="r-analysis-ai">📌 {f.aiReason}</div>}
                {f.hasNews&&f.newsLink&&<a href={f.newsLink} target="_blank" rel="noopener" className="r-analysis-link">{f.newsTitle||"相關新聞"} ↗</a>}
                {!f.hasNews&&<span style={{fontSize:10,color:"var(--muted)"}}>暫無相關新聞</span>}
              </div>
            </div>
          ))}
        </div>))}
      </div>}
      <div className="r-grid">
        {charts.map(c=>{
          const games=data&&data[c.key]||[];
          return(<div key={c.key} className="r-card">
            <div className={`r-card-hdr ${c.cls}`}>{c.cls==="ios"?"📱":"🤖"} {c.label}</div>
            {games.length===0?<div className="r-nodata">暫無資料</div>:games.map((g,i)=><RankItem key={i} g={g} rank={i+1} plat={c.plat}/>)}
          </div>);})}
      </div>
      <div className="r-news">
        <div className="r-news-hdr">📰 遊戲新聞</div>
        {(day.newsItems||[]).length===0?<div style={{padding:16,textAlign:"center",color:"var(--muted)",fontSize:12}}>暫無新聞</div>:
        (day.newsItems||[]).map((n,i)=>{const src=getSourceInfo(n.link,n.sourceName);
          return(<div key={i} className="r-news-item">
            {src.f?<img className="r-news-favicon" src={src.f} onError={e=>e.target.style.display="none"} alt=""/>:<div style={{width:18,height:18,background:"var(--card2)",borderRadius:4,flexShrink:0}}/>}
            <div>
              <a href={n.link} target="_blank" rel="noopener" className="r-news-title">{n.title}</a>
              <div className="r-news-meta">{src.n}{src.n&&n.dateStr?" · ":""}{n.dateStr}</div>
            </div>
          </div>);})}
      </div>
    </div>
    {appModal&&<div className="app-modal-bg" onClick={()=>setAppModal(null)}><div className="app-modal" onClick={e=>e.stopPropagation()}>
      <button className="app-modal-x" onClick={()=>setAppModal(null)}>✕</button>
      {appModal.loading&&<div className="modal-loading"><div className="spinner"/><div>載入中...</div></div>}
      {appModal.error&&<div style={{padding:40,textAlign:"center",color:"var(--red)"}}>{appModal.error}</div>}
      {appModal.intel&&!appModal.loading&&<div style={{background:"rgba(255,107,107,.08)",border:"1px solid rgba(255,107,107,.2)",borderRadius:8,padding:"8px 12px",marginBottom:12,display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontSize:12,color:"var(--red)",fontWeight:700}}>⚠️ 競品追蹤中</span>
        <button onClick={()=>{setAppModal(null);setIntelModal(appModal.intel);}} style={{fontSize:11,color:"var(--cyan)",background:"none",border:"1px solid rgba(0,212,255,.3)",borderRadius:5,padding:"2px 8px",cursor:"pointer",fontFamily:"inherit"}}>查看情報 →</button>
      </div>}
      {appModal.type==="ios"&&!appModal.loading&&appModal.data&&<IosAppDetail data={appModal.data}/>}
      {appModal.type==="gp"&&!appModal.loading&&appModal.data&&<GpAppDetail data={appModal.data}/>}
    </div></div>}
    {intelModal&&<IntelModal game={intelModal} onClose={()=>setIntelModal(null)}/>}
  </>);}

function IosAppDetail({data:app}){
  const[collapsed,setCollapsed]=useState(true);
  const rating=app.averageUserRating?app.averageUserRating.toFixed(1):"N/A";
  const stars=Array.from({length:5},(_,i)=>i<Math.round(app.averageUserRating||0)?"★":"☆").join("");
  const size=app.fileSizeBytes?`${(app.fileSizeBytes/1048576).toFixed(0)} MB`:"N/A";
  const storeUrl=app.trackViewUrl||`https://apps.apple.com/app/id${app.trackId}`;
  return(<>
    <div style={{display:"flex",gap:14,alignItems:"flex-start",marginBottom:14}}>
      {app.artworkUrl512&&<img className="app-icon-img" src={app.artworkUrl512} alt=""/>}
      <div style={{flex:1}}>
        <h2 style={{fontSize:18,fontWeight:800,marginBottom:3}}>{app.trackName}</h2>
        <div style={{fontSize:12,color:"var(--cyan)",marginBottom:6}}>{app.artistName}</div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{color:"#ffd700",fontSize:14}}>{stars}</span>
          <span style={{fontSize:12,color:"var(--muted)"}}>{rating} ({(app.userRatingCount||0).toLocaleString()}則)</span>
        </div>
      </div>
    </div>
    <div className="info-grid">
      <div className="info-cell"><div className="lbl">年齡分級</div><div className="val">{app.contentAdvisoryRating||"N/A"}</div></div>
      <div className="info-cell"><div className="lbl">大小</div><div className="val">{size}</div></div>
      <div className="info-cell"><div className="lbl">類別</div><div className="val">{app.genres&&app.genres[0]||"N/A"}</div></div>
    </div>
    {app.screenshotUrls&&app.screenshotUrls.length>0&&<div className="screenshots-row">{app.screenshotUrls.slice(0,4).map((s,i)=><img key={i} src={s} alt="" style={{height:150,borderRadius:8,flexShrink:0}}/>)}</div>}
    <div className={`app-desc ${collapsed?"col":""}`} dangerouslySetInnerHTML={{__html:(app.description||"").replace(/\n/g,"<br/>")}}/>
    <button className="show-more-btn" onClick={()=>setCollapsed(!collapsed)}>{collapsed?"顯示更多 ▼":"收起 ▲"}</button>
    <a href={storeUrl} target="_blank" rel="noopener" className="open-store-btn">📱 在 App Store 開啟</a>
  </>);}

function GpAppDetail({data:app}){
  const[collapsed,setCollapsed]=useState(true);
  const stars=Array.from({length:5},(_,i)=>i<Math.round(parseFloat(app.rating)||0)?"★":"☆").join("");
  return(<>
    <div style={{display:"flex",gap:14,alignItems:"flex-start",marginBottom:14}}>
      {app.icon&&<img className="app-icon-img" src={`${app.icon}=w80-h80`} alt=""/>}
      <div style={{flex:1}}>
        <h2 style={{fontSize:18,fontWeight:800,marginBottom:3}}>{app.name}</h2>
        <div style={{fontSize:12,color:"var(--cyan)",marginBottom:6}}>{app.developer}</div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{color:"#ffd700",fontSize:14}}>{stars}</span>
          <span style={{fontSize:12,color:"var(--muted)"}}>{app.rating} ({app.reviews}則)</span>
        </div>
      </div>
    </div>
    {app.screenshots&&app.screenshots.length>0&&<div className="screenshots-row">{app.screenshots.map((s,i)=><img key={i} src={`${s}=w200`} alt="" style={{height:150,borderRadius:8,flexShrink:0}}/>)}</div>}
    <div className={`app-desc ${collapsed?"col":""}`} dangerouslySetInnerHTML={{__html:(app.description||"").replace(/\n/g,"<br/>")}}/>
    <button className="show-more-btn" onClick={()=>setCollapsed(!collapsed)}>{collapsed?"顯示更多 ▼":"收起 ▲"}</button>
    <a href={app.storeUrl} target="_blank" rel="noopener" className="open-store-btn">🤖 在 Google Play 開啟</a>
  </>);}

// ─────────────────────────────────────────
// MAIN APP
// ─────────────────────────────────────────
function App(){
  const[mainTab,setMainTab]=useState("ranking");
  const[intelProducts,setIntelProducts]=useState([]);
  useEffect(()=>{
    fetch(`${INTEL_BASE}/products.json`).then(r=>r.json()).then(setIntelProducts).catch(()=>{});
  },[]);
  return(<div className="app">
    <div className="hdr"><div className="hdr-in">
      <div className="logo">
        <div className="logo-ic">🎮</div>
        <div><h1>手遊情報中心</h1><small>排行榜 · 市場情報 · AI 分析</small></div>
      </div>
      <div className="main-tabs">
        <button className={`main-tab ${mainTab==="ranking"?"on":""}`} onClick={()=>setMainTab("ranking")}>🎮 排行榜</button>
        <button className={`main-tab ${mainTab==="intel"?"on":""}`} onClick={()=>setMainTab("intel")}>📊 市場情報</button>
      </div>
      <div style={{fontSize:11,color:"var(--muted)",display:"flex",alignItems:"center",gap:6}}>
        <span className="dot"/>{intelProducts.length>0?`追蹤 ${intelProducts.length} 款競品`:""}
      </div>
    </div></div>
    {mainTab==="ranking"&&<RankingTab intelProducts={intelProducts}/>}
    {mainTab==="intel"&&<IntelTab/>}
    <div style={{textAlign:"center",padding:"16px 24px 32px",fontSize:10,color:"var(--muted)"}}>
      手遊情報中心 · 排行榜資料每日自動更新 · 情報資料來自公開可查證來源
    </div>
  </div>);}

ReactDOM.render(<App/>,document.getElementById('app'));
</script>
</body>
</html>
