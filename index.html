<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#06080f;--surface:#0d1117;--card:#131921;--card2:#1a2230;--border:#1c2333;--border2:#2a3548;--text:#e6edf3;--dim:#8b949e;--muted:#545d68;--cyan:#00d4ff;--green:#2dd4a8;--red:#ff6b6b;--orange:#ffaa33;--yellow:#ffe066;--pink:#ff79c6;--mobile:#ff6b35;--console:#7c5cfc;--accent:#00b894}
body{font-family:'Outfit','Noto Sans TC',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:60px 60px;opacity:.1;pointer-events:none;z-index:0}
.app{position:relative;z-index:1}
a{color:var(--cyan);text-decoration:none}
.hdr{padding:12px 24px;border-bottom:1px solid var(--border);background:rgba(13,17,23,.96);backdrop-filter:blur(16px);position:sticky;top:0;z-index:100}
.hdr-in{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo-ic{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--cyan),var(--console));display:flex;align-items:center;justify-content:center;font-size:17px}
.logo h1{font-size:15px;font-weight:800;letter-spacing:-.4px}
.logo small{display:block;font-size:10px;color:var(--muted);font-weight:400}
.main-tabs{display:flex;gap:4px}
.main-tab{padding:7px 16px;border-radius:8px;font-size:13px;font-weight:700;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font-family:inherit;transition:all .2s;display:flex;align-items:center;gap:6px}
.main-tab.on{background:var(--card2);color:var(--cyan);border-color:rgba(0,212,255,.3)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}

.r-controls{max-width:1440px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--border);background:rgba(13,17,23,.8);position:sticky;top:57px;z-index:99}
.r-select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit;outline:none}
.r-select:focus{border-color:var(--cyan)}

.r-analysis{background:rgba(255,249,230,.04);border:1px solid rgba(240,192,64,.2);border-radius:12px;padding:14px 16px;margin-bottom:20px}

.i-plat-tabs{display:flex;gap:0;margin-bottom:0}
.i-ptab{flex:1;padding:11px 16px;cursor:pointer;border:1px solid var(--border);border-bottom:none;border-radius:12px 12px 0 0;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;background:var(--surface);font-family:inherit;color:var(--muted)}

.i-stats{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.i-sbox{flex:1;min-width:110px;padding:10px 14px;background:var(--surface);border-radius:8px;border:1px solid var(--border)}

.gcard-h{display:flex;justify-content:space-between;align-items:start;margin-bottom:6px;gap:6px}

.gcard-f{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);padding-top:6px;border-top:1px solid var(--border)}
.pill{display:inline-block;padding:1px 8px;border-radius:16px;font-size:10px;font-weight:700}
.kanban{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.kcol{min-width:240px;flex:1}
.kcol-h{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:6px;margin-bottom:8px}
.bitem{padding:14px;border-radius:10px;margin-bottom:8px;border-left:4px solid}
.bitem.bu{background:rgba(255,107,107,.05);border-left-color:var(--red)}
.bitem.bw{background:rgba(255,170,51,.05);border-left-color:var(--orange)}
.bitem.bi{background:rgba(84,93,104,.06);border-left-color:var(--muted)}
.bitem-t{font-size:13px;font-weight:700;margin-bottom:4px}

.bitem-a{padding:6px 10px;border-radius:6px;font-size:11px;background:rgba(0,212,255,.05);border:1px solid rgba(0,212,255,.12);color:var(--cyan)}
.threat-card{background:var(--surface);border-radius:10px;padding:16px;border:1px solid var(--border);margin-bottom:10px;border-left:4px solid}
.tl-track{display:flex;align-items:center;padding:8px 0;overflow-x:auto}

.tl-dot{width:12px;height:12px;border-radius:6px;border:2px solid var(--bg);z-index:1}

.gantt-wrap{overflow-x:auto;padding-bottom:6px}

.gantt-lbl{width:150px;min-width:150px;font-size:10px;font-weight:700;color:var(--muted);padding:3px 6px}

.gantt-mh.qs{border-left:2px solid var(--border2)}
.gantt-row{display:flex;align-items:center;border-bottom:1px solid var(--border);min-height:30px}
.gantt-row:hover{background:var(--card2)}
.gantt-row-lbl{width:150px;min-width:150px;padding:4px 6px;display:flex;align-items:center;gap:4px}
.gantt-row-nm{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gantt-row-chart{flex:1;position:relative;height:24px;display:flex}
.gantt-cell{flex:1;border-left:1px solid var(--border)}
.gantt-cell.qs{border-left:2px solid var(--border2)}
.gantt-bar{position:absolute;height:16px;top:4px;border-radius:3px;min-width:3px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.gantt-bar:hover{opacity:.8;z-index:1}
.gantt-bar-t{font-size:8px;font-weight:700;color:#000;white-space:nowrap;overflow:hidden;padding:0 3px}
.gantt-today{position:absolute;top:0;bottom:0;width:2px;background:var(--cyan);z-index:1;opacity:.5}
.i-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300;display:flex;justify-content:center;align-items:flex-start;padding:28px 16px;overflow-y:auto;backdrop-filter:blur(4px);animation:fi .2s}

@media(max-width:768px){.hdr{padding:10px 12px}.r-controls{padding:8px 12px;top:52px}.r-content{padding:12px}.i-wrap{padding:12px}.r-grid{grid-template-columns:repeat(2,1fr)}.gantt-lbl,.gantt-row-lbl{width:100px;min-width:100px}}

<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel">
const {useState,useMemo,useEffect}=React;

const GAS_URL='https://script.google.com/macros/s/AKfycbxKBRt_hT6vvOjn2d9ZTZqGevmrRbLSJigBvnBST8qbO8nvRLnW9ftYRHPXlnrPYeGe6w/exec';
const INTEL_BASE='https://tony0424001-crypto.github.io/game-market-intel/data';

const SM={"announced":"已公佈","pre-reg":"預註冊","cbt":"封測中","soft-launch":"軟啟動","live-ops":"已上線","launch":"上線","media":"媒體曝光","launched":"已上線"};
const SC={"announced":"#545d68","pre-reg":"#ffaa33","cbt":"#00d4ff","soft-launch":"#7c5cfc","live-ops":"#2dd4a8","launch":"#2dd4a8","media":"#ff79c6","launched":"#2dd4a8"};
const TM={critical:"極高",high:"高",medium:"中",low:"低"};
const TC={critical:"#ff6b6b",high:"#ffaa33",medium:"#ffe066",low:"#2dd4a8"};
const ST=["announced","pre-reg","cbt","soft-launch","live-ops"];
const PM={urgent:{c:"bu",l:"🚨 需立即行動",k:"var(--red)"},watch:{c:"bw",l:"👁 值得關注",k:"var(--orange)"},info:{c:"bi",l:"ℹ️ 背景資訊",k:"var(--muted)"}};
const MZH=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
const FLAG={"CN":"🇨🇳","TW/HK/MO":"🇹🇼","JP":"🇯🇵","KR":"🇰🇷","Global":"🌏","TW":"🇹🇼"};

function useJson(url,fb){
  const[d,setD]=useState(null);const[l,setL]=useState(true);
  useEffect(()=>{let c=false;fetch(url).then(r=>{if(!r.ok)throw r.status;return r.json()}).then(j=>{if(!c){setD(j);setL(false)}}).catch(()=>{if(!c){setD(fb);setL(false)}});return()=>{c=true}},[url]);
  return[d,l];
}

function matchGameName(rankName,intelName){
  if(!rankName||!intelName)return false;
  const norm=s=>s.toLowerCase().replace(/[®™©：:·\-\s『』「」【】《》]/g,'').replace(/[^\u4e00-\u9fa5a-z0-9]/g,'').trim();
  const rn=norm(rankName),inn=norm(intelName);
  if(!rn||!inn)return false;
  if(rn===inn)return true;
  if(rn.length>=4&&inn.includes(rn))return true;
  if(inn.length>=4&&rn.includes(inn))return true;
  if(rn.length>=6&&inn.length>=6&&rn.substring(0,6)===inn.substring(0,6))return true;
  return false;
}
function findIntel(gameName,products){
  if(!products||!gameName)return null;
  return products.find(p=>matchGameName(gameName,p.name)||(p.nameEn&&matchGameName(gameName,p.nameEn)))||null;
}
function daysUntil(ds){if(!ds)return null;const m=ds.match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return null;const t=new Date(+m[1],+m[2]-1,+m[3]);const n=new Date();n.setHours(0,0,0,0);return Math.ceil((t-n)/86400000);}

// ── 強化版 parseD，支援多種格式 ──
function parseD(s){
  if(!s||typeof s!=='string')return null;
  s=s.trim();
  // YYYY-MM
  let m=s.match(/^(\d{4})-(\d{2})$/);
  if(m)return{y:+m[1],m:+m[2]};
  // YYYY-QN
  let q=s.match(/^(\d{4})-Q(\d)$/i);
  if(q)return{y:+q[1],m:{1:2,2:5,3:8,4:11}[q[2]]||6};
  // YYYY/MM
  let sm=s.match(/^(\d{4})\/(\d{1,2})$/);
  if(sm)return{y:+sm[1],m:+sm[2]};
  // YYYY年MM月
  let ym=s.match(/^(\d{4})年(\d{1,2})月/);
  if(ym)return{y:+ym[1],m:+ym[2]};
  // QN YYYY 或 YYYY QN
  let qy=s.match(/Q(\d)\s*(\d{4})/i)||s.match(/(\d{4})\s*Q(\d)/i);
  if(qy){const qi=qy[0].match(/Q(\d)/i);const yi=qy[0].match(/(\d{4})/);if(qi&&yi)return{y:+yi[1],m:{1:2,2:5,3:8,4:11}[qi[1]]||6};}
  // YYYY only
  let yo=s.match(/^(\d{4})$/);
  if(yo)return{y:+yo[1],m:6};
  // 上半年/下半年
  if(s.match(/(\d{4}).*上半年/)){const y=s.match(/(\d{4})/);if(y)return{y:+y[1],m:3};}
  if(s.match(/(\d{4}).*下半年/)){const y=s.match(/(\d{4})/);if(y)return{y:+y[1],m:9};}
  return null;
}
